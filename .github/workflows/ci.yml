name: CI

# push / PR ごとに型検査とテスト（vitest を Workers ランタイム上で）を回す。
# Cloudflare の認証は要らない（D1 はテストファイルごとの空のローカル DB、外部 API は叩かない）。
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # ubuntu-latest は予告なく次の LTS に切り替わる（2026-10-19 から Ubuntu 26）ので版を固定する。
    # 上げるときはここを書き換えて CI が通るのを確かめる。
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後のステップで git を使わないので、GITHUB_TOKEN を .git に残さない。
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # worker-configuration.d.ts（Env の型）と wrangler.jsonc は .gitignore 済み。tsconfig が前者を
      # 読むので、sample から wrangler.jsonc を作って `wrangler types` で生成する（DB ID は型に関係ない）。
      # vitest は vitest.config.mts が wrangler.jsonc.sample から wrangler.test.jsonc を作るので不要。
      - name: Generate Worker types
        run: |
          cp wrangler.jsonc.sample wrangler.jsonc
          npx wrangler types

      - name: Type check
        run: |
          npx tsc --noEmit
          npx tsc --noEmit -p test

      - name: Test
        run: npx vitest run
