<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 編集用の ?t=<token> 付きで開かれたら、計測・広告タグが読む前にアドレスバーから消す
       （index.html と同じ。token は sessionStorage へ移し、view.js が読む）。 -->
  <script>(function(){try{var u=new URL(location.href),t=u.searchParams.get("t");if(!t)return;var m=location.pathname.match(/^\/l\/([A-Za-z0-9_-]+)$/);if(m){window.__EDIT_TOKEN__={slug:m[1],t:t};try{sessionStorage.setItem("my100manga_edit_token",JSON.stringify({slug:m[1],t:t}));}catch(e){}}u.searchParams.delete("t");history.replaceState(history.state,"",u.pathname+u.search+u.hash);}catch(e){}})();</script>
  <!--OGP_META-->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#3b82f6">
  <!--ANALYTICS-->
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!--GTM_BODY-->
  <header class="site">
    <h1><span class="owner-line" id="ownerLine" hidden><span class="owner-title" id="ownerTitle"></span><button class="report-flag" id="reportOwner" title="このユーザー名を通報"><span class="flag-icon">⚐</span><span class="flag-text">名前を通報</span></button></span><a class="site-logo" href="/">My <span class="accent">100</span> Manga</a></h1>
    <p class="tagline" id="subtitle">自分を構成する100の漫画</p>
    <!--HEADER_LINKS-->
  </header>

  <div class="wrap">
    <div class="toolbar" id="viewToolbar">
      <p class="owner-bio" id="ownerBio" style="display:none"></p>
      <button class="report-flag" id="reportBio" style="display:none" title="このひとことを通報"><span class="flag-icon">⚐</span><span class="flag-text">ひとことを通報</span></button>
      <div style="flex:1"></div>
      <button class="x-post" id="xPost">𝕏 でポスト</button>
      <button id="xImage">画像でポスト</button>
      <a class="button" href="/">自分でも作る</a>
      <button id="editLink" style="display:none">このリストを編集</button>
    </div>

    <div class="grid" id="grid" aria-label="おすすめ漫画リスト"></div>
  </div>

  <!--FOOTER_AFF-->

  <!-- detail modal -->
  <div class="modal-backdrop modal-sheet" id="detailModal">
    <div class="modal">
      <div class="report-menu" id="reportMenu" style="display:none">
        <button type="button" class="report-toggle" id="reportToggle" title="通報する" aria-haspopup="true" aria-expanded="false">⚐</button>
        <div class="report-pop" id="reportPop" hidden>
          <button type="button" class="report-item" id="reportTitle" style="display:none">本のタイトルを修正</button>
          <button type="button" class="report-item" id="reportCover" style="display:none">この表紙を通報</button>
          <button type="button" class="report-item" id="reportComment" style="display:none">このコメントを通報</button>
        </div>
      </div>
      <h2 id="dTitle"></h2>
      <div class="detail-body">
        <div id="dCoverBox"></div>
        <div class="dinfo">
          <div class="dauthor" id="dAuthor"></div>
          <dl class="dmeta" id="dMeta">
            <div class="dmeta-row" id="dSeriesRow" style="display:none"><dt>シリーズ</dt><dd><a id="dSeries" class="series-link"></a></dd></div>
            <div class="dmeta-row" id="dVolRow" style="display:none"><dt>巻</dt><dd id="dVol"></dd></div>
            <div class="dmeta-row" id="dPublisherRow" style="display:none"><dt>出版社</dt><dd id="dPublisher"></dd></div>
            <div class="dmeta-row" id="dLabelRow" style="display:none"><dt>レーベル</dt><dd id="dLabel"></dd></div>
            <div class="dmeta-row" id="dPubdateRow" style="display:none"><dt>発行日</dt><dd id="dPubdate"></dd></div>
            <div class="dmeta-row" id="dIsbnRow" style="display:none"><dt>ISBN</dt><dd id="dIsbn"></dd></div>
            <div class="dmeta-row" id="dSourceRow" style="display:none"><dt>画像参考元</dt><dd id="dSource"></dd></div>
          </dl>
          <div class="dcomment" id="dComment"></div>
          <button class="primary detail-reveal" id="dReveal" style="display:none">ネタバレを表示</button>
        </div>
      </div>
      <div class="dsynopsis" id="dSynopsisBox" style="display:none">
        <div class="dsynopsis-title">あらすじ</div>
        <p class="dsynopsis-text" id="dSynopsis"></p>
        <p class="dsynopsis-src">出典: 楽天ブックス</p>
      </div>
      <div class="buy" id="dBuy" style="display:none">
        <div class="buy-title">購入リンク<span class="pr-label">PR</span></div>
        <div class="buy-group" id="dBuyPrint"></div>
        <div class="buy-group" id="dBuyEbook"></div>
        <div class="buy-group" id="dBuyUsed"></div>
        <p class="buy-note">[AD]絶版でも電子書籍なら手に入ることがあります。リンクは各社アフィリエイトを含みます。</p>
      </div>
      <div class="modal-actions">
        <div style="flex:1"></div>
        <button id="dClose">閉じる</button>
      </div>
    </div>
    <!-- 前後の本へ（フリックと同じ移動を、クリックと ←→ キーでも。public/view.js） -->
    <button type="button" class="detail-nav prev" id="dPrev" aria-label="前の本" title="前の本（←）" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg></button>
    <button type="button" class="detail-nav next" id="dNext" aria-label="次の本" title="次の本（→）" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
  </div>

  <!--LIST_DATA-->
  <script src="/ui-dialog.js"></script>
  <script src="/api.js"></script>
  <script src="/turnstile.js"></script>
  <script src="/cover-fit.js"></script>
  <script src="/cover-zoom.js"></script>
  <script src="/author-link.js"></script>
  <script src="/affiliate.js"></script>
  <script src="/mylists.js"></script>
  <script src="/account.js"></script>
  <script src="/share-x.js"></script>
  <script src="/view.js"></script>
</body>
</html>
