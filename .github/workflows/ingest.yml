name: MADB ingest

# Manual import of the メディア芸術データベース (MADB) LOD dump into the remote D1.
# MADB publishes a new release roughly monthly; we pull the latest tag and rebuild
# the series/volumes master. Run on demand via the Actions "Run workflow" button.
#
# 既定の投入先は dev。本番 (prod) を選んだ実行は GitHub Environment `production` に紐づけ、
# その Environment の必須レビュアー（Settings → Environments → production → Required reviewers）
# の承認を待ってから走る。Environment が未作成だと承認なしで走ってしまうので、先に作っておくこと。
# 本番に流す前は dev で一度通し、リポ直下 CLAUDE.md の手順（全セッションへの予告）に従う。
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "target D1 environment"
        type: choice
        options:
          - dev
          - prod
        default: dev
      tag:
        description: "MADB release tag (blank = latest)"
        required: false
        default: ""

concurrency:
  group: madb-ingest-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # prod のときだけ承認ゲート付きの Environment に入れる（空文字なら Environment なし）。
    environment: ${{ inputs.environment == 'prod' && 'production' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # wrangler.jsonc は .gitignore 済み（DB ID 等の個人値を公開リポに載せない方針）。
      # ingest.mjs は `wrangler d1 execute DB` で binding→database_id を解決するため、
      # sample から実ファイルを復元し、prod/dev の database_id を secret で埋める。
      # 選択した環境の ID が未設定なら明示的に失敗させる。
      - name: Materialize wrangler.jsonc
        env:
          PROD_DB_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          DEV_DB_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID_DEV }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          cp wrangler.jsonc.sample wrangler.jsonc
          [ -n "$PROD_DB_ID" ] && sed -i "s/REPLACE_WITH_PROD_DATABASE_ID/${PROD_DB_ID}/" wrangler.jsonc
          [ -n "$DEV_DB_ID" ] && sed -i "s/REPLACE_WITH_DEV_DATABASE_ID/${DEV_DB_ID}/" wrangler.jsonc
          if [ "$TARGET_ENV" = "dev" ]; then
            test -n "$DEV_DB_ID" || { echo "::error::secret CLOUDFLARE_D1_DATABASE_ID_DEV is empty"; exit 1; }
          else
            test -n "$PROD_DB_ID" || { echo "::error::secret CLOUDFLARE_D1_DATABASE_ID is empty"; exit 1; }
          fi

      # 失敗時に戻せるよう、投入直前の Time Travel ブックマークをログに残す（db/MIGRATIONS.md）。
      # 戻すとき: npx wrangler d1 time-travel restore DB [--env dev] --bookmark=<bookmark>
      - name: Record D1 Time Travel bookmark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          ENV_ARGS=""
          [ "$TARGET_ENV" = "dev" ] && ENV_ARGS="--env dev"
          npx wrangler d1 time-travel info DB $ENV_ARGS | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Ingest MADB → remote D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # raises the GitHub API rate limit for release download
          TARGET_ENV: ${{ inputs.environment }}
          # inputs.tag はユーザ入力。run: に直接展開するとシェルインジェクションになるため、
          # 必ず env 経由で受け取り、値があるときだけ --tag "$INPUT_TAG" を付ける。
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          ENV_ARGS=""
          [ "$TARGET_ENV" = "dev" ] && ENV_ARGS="--env dev"
          if [ -n "$INPUT_TAG" ]; then
            node scripts/ingest.mjs --remote $ENV_ARGS --tag "$INPUT_TAG"
          else
            node scripts/ingest.mjs --remote $ENV_ARGS
          fi
