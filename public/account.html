<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アカウント設定 | My 100 Manga</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#3b82f6">
  <!--ANALYTICS-->
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!--GTM_BODY-->
  <header class="site">
    <h1><a class="site-logo" href="/">My <span class="accent">100</span> Manga</a></h1>
    <p class="tagline">アカウント設定</p>
    <!--HEADER_LINKS-->
  </header>

  <div class="wrap">
    <article class="prose" id="accountPage">
      <h2>アカウント設定</h2>
      <p id="accountLoading" class="hint">読み込み中…</p>

      <div id="accountGuest" hidden>
        <p>ログインしていません。</p>
        <p><a id="accountLoginLink" class="button primary" href="/auth/google/login?return=/account">Googleでログイン</a></p>
      </div>

      <div id="accountUser" hidden>
        <h3>ログイン中のアカウント</h3>
        <ul>
          <li>名前: <span id="accountName"></span></li>
          <li>メールアドレス: <span id="accountEmail"></span></li>
        </ul>
        <p><a href="/#myLists">あなたのリスト</a></p>
        <p><button type="button" id="accountLogout">ログアウト</button></p>

        <details class="account-danger">
          <summary>退会（アカウントの削除）</summary>
          <p>
            アカウントと、アカウントに保存された作成中のリストを削除します。元に戻せません。
            アカウントに紐付いた公開リストは、一緒に削除するか、紐付けを外して匿名の公開リストとして残すかを選べます。
          </p>
          <p><button type="button" class="danger" id="accountWithdraw">退会する</button></p>
        </details>
      </div>
    </article>

    <div class="publish-bar">
      <a class="button primary" href="/">トップにもどる</a>
    </div>
  </div>

  <!--FOOTER-->
  <script src="/ui-dialog.js"></script>
  <script src="/api.js"></script>
  <script src="/mylists.js"></script>
  <script src="/account.js"></script>
  <script src="/account-page.js"></script>
</body>
</html>
