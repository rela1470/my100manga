<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--OGP_META-->
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site">
    <h1><a href="/" style="text-decoration:none;color:inherit">my<span class="accent">100</span>manga</a></h1>
    <p class="tagline" id="subtitle">私を構成する100の漫画</p>
  </header>

  <div class="wrap">
    <div class="toolbar" id="viewToolbar">
      <span class="count"><span id="filled">0</span> 作品</span>
      <button class="report-link" id="reportOwner" style="display:none" title="このユーザー名を通報">⚐ 名前を通報</button>
      <div style="flex:1"></div>
      <a href="/"><button>自分でも作る</button></a>
      <button id="editLink" style="display:none">このリストを編集</button>
    </div>

    <div class="grid" id="grid" aria-label="おすすめ漫画リスト"></div>
  </div>

  <footer class="site">
    <p>データ提供: メディア芸術データベース（文化庁）／ 書影: 楽天ブックス・Google Books ｜ my100manga</p>
    <p class="aff-disclosure">当サイトは Amazon アソシエイト・楽天アフィリエイト等を利用しており、リンク経由の購入で収益を得ることがあります。</p>
    <p class="foot-links"><a href="/about">利用ソース・アフィリエイトについて</a></p>
  </footer>

  <!-- detail modal -->
  <div class="modal-backdrop" id="detailModal">
    <div class="modal">
      <div class="report-menu" id="reportMenu" style="display:none">
        <button type="button" class="report-toggle" id="reportToggle" title="通報する" aria-haspopup="true" aria-expanded="false">⚐</button>
        <div class="report-pop" id="reportPop" hidden>
          <button type="button" class="report-item" id="reportCover" style="display:none">この表紙を通報</button>
          <button type="button" class="report-item" id="reportComment" style="display:none">このコメントを通報</button>
        </div>
      </div>
      <h2 id="dTitle"></h2>
      <div class="detail-body">
        <div id="dCoverBox"></div>
        <div class="dinfo">
          <div class="dauthor" id="dAuthor"></div>
          <div class="dcomment" id="dComment"></div>
          <button class="primary detail-reveal" id="dReveal" style="display:none">ネタバレを表示</button>
        </div>
      </div>
      <div class="buy" id="dBuy" style="display:none">
        <div class="buy-title">購入する</div>
        <div class="buy-group" id="dBuyPrint"></div>
        <div class="buy-group" id="dBuyEbook"></div>
        <div class="buy-group" id="dBuyUsed"></div>
        <p class="buy-note">[AD]絶版でも電子書籍なら手に入ることがあります。リンクは各社アフィリエイトを含みます。</p>
      </div>
      <div class="modal-actions">
        <div style="flex:1"></div>
        <button id="dClose">閉じる</button>
      </div>
    </div>
  </div>

  <!--LIST_DATA-->
  <script src="/affiliate.js"></script>
  <script src="/mylists.js"></script>
  <script src="/view.js"></script>
</body>
</html>
